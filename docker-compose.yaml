services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: vrag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./lib/memory/db/ddl.sql:/docker-entrypoint-initdb.d/ddl.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vrag"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
